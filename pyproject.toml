[project]
name = "emirates-skywards-discord"
version = "0.1.0"
description = "A Discord bot for Emirates PTFS Skywards accounts, events, miles, and perks."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0,<1.0.0",
    "discord.py>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
skywards-bot = "bot.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

